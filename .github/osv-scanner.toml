# Known vulnerabilities that have been looked at and accepted. Each entry says why, and expires so
# that it is looked at again (okf/operations/security-checks.md). Prefer upgrading to accepting.
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-12-31
# reason = "Only reachable through …, which WhatBuild never calls."

# fast-uri comes with ajv, under @modelcontextprotocol/sdk. Ajv resolves the $id and $ref of the
# schemas it compiles with it; those come from WhatBuild and the SDK, never from a request. Fixed in
# 3.1.9: upgrade once it is a week old (2026-10-26).
[[IgnoredVulns]]
id = "GHSA-333x-w4r6-6crp"
ignoreUntil = 2026-11-01
reason = "fast-uri under ajv, which resolves only the URIs of schemas WhatBuild and the MCP SDK define. Upgrade to 3.1.9 once it is a week old."

