# Known vulnerabilities that have been looked at and accepted. Each entry says why, and expires so
# that it is looked at again (okf/operations/security-checks.md). Prefer upgrading to accepting.
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2026-12-31
# reason = "Only reachable through …, which WhatBuild never calls."

# @azure/msal-node 6, under @azure/identity 4.14.0. @azure/identity 4.14.1 moves to 7, the fixed
# major: upgrade once it is a week old (2026-11-06). The flaw is in MSAL's authorization code flow;
# WhatBuild uses @azure/identity only for a managed identity that sends mail through Azure
# Communication Services (adapters/mail-acs.ts).
[[IgnoredVulns]]
id = "GHSA-xcx6-jx8p-x3h5"
ignoreUntil = 2026-11-09
reason = "MSAL's authorization code flow, which WhatBuild never uses: @azure/identity serves only a managed identity for mail. Upgrade @azure/identity to 4.14.1, which takes @azure/msal-node 7, once it is a week old, on 2026-11-06."
