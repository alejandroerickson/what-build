name: CI

# The same path a contributor runs: install, typecheck, test against a real Postgres (the
# embedded-postgres package, nothing to provision), and build the production bundle. Beside it, the
# check that nothing private is published: the new commits, their messages and the pull request's
# text (okf/operations/security-checks.md). Actions are pinned to commits; Dependabot updates them.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The documentation bundle is valid
        run: python3 okf/tools/validate_okf.py
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The embedded skill matches SKILL.md
        run: node scripts/gen-skill.mjs && git diff --exit-code packages/core/src/skill/skill-text.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  publishable:
    name: Nothing private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commits being added, back to where they branch off
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: The pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-publishable.mjs --revs "$BASE..$HEAD"
      - name: The pull request's text
        # Dependabot's text quotes its dependencies' public release notes, addresses and all.
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pull-request.txt"
          node scripts/check-publishable.mjs --message "$RUNNER_TEMP/pull-request.txt"
      - name: The pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/check-publishable.mjs --revs "$BEFORE..$AFTER"
