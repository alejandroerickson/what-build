name: CI

# The same path a contributor runs: install, typecheck, test against a real Postgres (the
# embedded-postgres package, nothing to provision), and build the production bundle. Beside it, the
# check that nothing private is published in the new commits and their messages; the pull request's
# text has a workflow of its own, pull-request-text.yml (okf/operations/security-checks.md). Actions
# are pinned to commits; Dependabot updates them.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The documentation bundle is valid
        run: python3 okf/tools/validate_okf.py
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The embedded skill matches SKILL.md
        run: node scripts/gen-skill.mjs && git diff --exit-code packages/core/src/skill/skill-text.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  publishable:
    name: Nothing private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commits being added, back to where they branch off
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: The pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-publishable.mjs --revs "$BASE..$HEAD"
      - name: The pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/check-publishable.mjs --revs "$BEFORE..$AFTER"
