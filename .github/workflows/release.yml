name: Release

# A tag v* on a commit of main is a release: the image is built from the Dockerfile and published
# to the GitHub container registry as ghcr.io/<owner>/what-build:<tag>, and the tag's GitHub
# release gets the image and the migrations at the top of its notes. A release published on GitHub
# (in the browser or with `gh release create`) makes its tag and so starts this workflow; a tag
# pushed alone gets a release with generated notes. A deployment then pulls a released image rather
# than building one; what a deployment does with it is the deployment's own business
# (okf/operations/releasing.md).
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      packages: write # the image
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the previous tag, for the migrations since it
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: WHATBUILD_COMMIT=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes say which migrations the release adds since the previous tag: going back past a
        # release that adds one needs the database restored (okf/operations/recovering-from-a-bad-release.md).
        # A release that already exists keeps its notes, under ours; a re-run adds nothing twice.
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_SHA^" 2>/dev/null || true)
          added=$(git diff --name-only --diff-filter=A ${prev:-$(git rev-list --max-parents=0 HEAD)} "$GITHUB_SHA" -- apps/server/src/migrations/ | xargs -r -n1 basename | sed 's/^/- `/; s/$/`/')
          if [ -n "$added" ]; then
            migrations="**Migrations.** This release changes the database schema${prev:+ since $prev}:"$'\n'"$added"$'\n\n'"Going back to an earlier release needs the database restored to before these ran. Take a restore point before deploying."
          else
            migrations="**Migrations.** None${prev:+ since $prev}: going back to the previous release needs only the previous image."
          fi
          image="Image: \`ghcr.io/$GITHUB_REPOSITORY:$GITHUB_REF_NAME\` (linux/amd64), built from \`$GITHUB_SHA\`."
          notes="$image"$'\n\n'"$migrations"$'\n\n'"If a release breaks your deployment: [recovering from a bad release](https://github.com/$GITHUB_REPOSITORY/blob/main/okf/operations/recovering-from-a-bad-release.md)."
          if body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body 2>/dev/null); then
            case "$body" in *"$image"*) echo "The release already has its notes."; exit 0 ;; esac
            if [ -z "$body" ]; then
              body=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" ${prev:+-f previous_tag_name="$prev"} --jq .body)
            fi
            gh release edit "$GITHUB_REF_NAME" --notes "$notes"$'\n\n'"$body"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --notes "$notes"
          fi
