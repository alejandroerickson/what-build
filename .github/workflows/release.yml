name: Release

# A tag v* on a commit of main is a release: the image is built from deploy/Dockerfile and published
# to the GitHub container registry as ghcr.io/<owner>/what-build:<tag>, and the tag's GitHub
# release gets the image and the migrations at the top of its notes. A release published on GitHub
# (in the browser or with `gh release create`) makes its tag and so starts this workflow; a tag
# pushed alone gets a release with generated notes. A deployment then pulls a released image rather
# than building one; what a deployment does with it is the deployment's own business
# (okf/operations/releasing.md).
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      packages: write # the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the earlier tags, for the migrations since the last one with an image
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        # No provenance and no build record: the provenance holds the event that started the build,
        # the pusher's address with it, which the action prints in this log and keeps as a build
        # record artifact. The labels say which commit and release an image is.
        env:
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: WHATBUILD_COMMIT=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes say which migrations the release adds since the last earlier release that has an
        # image: a deployment goes back only to a release it can pull, and going back past one that
        # adds a migration needs the database restored (okf/operations/recovering-from-a-bad-release.md).
        # An earlier tag whose workflow failed published no image: it is passed over, and named.
        # A release that already exists keeps its notes, under ours; a re-run adds nothing twice.
        run: |
          prev="" skipped=""
          for t in $(git tag --list 'v*' --merged "$GITHUB_SHA^" --sort=-version:refname); do
            if docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY,,}:$t" >/dev/null 2>&1; then prev=$t; break; fi
            skipped="${skipped:+$skipped, }$t"
          done
          without="${skipped:+ ($skipped published no image)}"
          added=$(git diff --name-only --diff-filter=A ${prev:-$(git rev-list --max-parents=0 HEAD)} "$GITHUB_SHA" -- apps/server/src/migrations/ | xargs -r -n1 basename | sed 's/^/- `/; s/$/`/')
          if [ -n "$added" ]; then
            migrations="**Migrations.** This release changes the database schema${prev:+ since $prev, the last release with an image}$without:"$'\n'"$added"$'\n\n'"Going back to an earlier release needs the database restored to before these ran. Take a restore point before deploying."
          elif [ -n "$prev" ]; then
            migrations="**Migrations.** None since $prev, the last release with an image$without: going back to it needs only its image."
          else
            migrations="**Migrations.** None."
          fi
          image="Image: \`ghcr.io/$GITHUB_REPOSITORY:$GITHUB_REF_NAME\` (linux/amd64), built from \`$GITHUB_SHA\`."
          notes="$image"$'\n\n'"$migrations"$'\n\n'"If a release breaks your deployment: [recovering from a bad release](https://github.com/$GITHUB_REPOSITORY/blob/main/okf/operations/recovering-from-a-bad-release.md)."
          if body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body 2>/dev/null); then
            case "$body" in *"$image"*) echo "The release already has its notes."; exit 0 ;; esac
            if [ -z "$body" ]; then
              body=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" ${prev:+-f previous_tag_name="$prev"} --jq .body)
            fi
            gh release edit "$GITHUB_REF_NAME" --notes "$notes"$'\n\n'"$body"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ${prev:+--notes-start-tag "$prev"} --notes "$notes"
          fi
