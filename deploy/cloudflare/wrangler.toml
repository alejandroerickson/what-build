# The Cloudflare Worker in front of WhatBuild (worker.js). Build the web app first, then deploy
# with this deployment's addresses; the custom domains are attached to the Worker in Cloudflare:
#
#   corepack pnpm build
#   npx wrangler deploy --config deploy/cloudflare/wrangler.toml \
#     --var ORIGIN:https://<service>-<project number>.<region>.run.app \
#     --var SITE_HOST:example.com --var APP_URL:https://app.example.com \
#     --var ANALYTICS_ID:G-XXXXXXXXXX --var CF_ANALYTICS_TOKEN:<token>
#
# The last two are optional. ANALYTICS_ID is Google Analytics, loaded on the site's pages once a
# visitor accepts; CF_ANALYTICS_TOKEN is a Cloudflare Web Analytics site token, whose beacon sets
# no cookie and so counts every visit. The plans' limits and prices, whether guests may sign up, and
# who runs the deployment and who else handles its data, which the privacy page says, come from the
# service (GET /api/v1/plans), kept in Cloudflare's cache for an hour.
#
# The edge key, the service's WHATBUILD_EDGE_KEY, is a secret: put it once, and deploys keep it.
#
#   gcloud secrets versions access latest --secret whatbuild-edge-key --project <project> \
#     | npx wrangler secret put EDGE_KEY --config deploy/cloudflare/wrangler.toml
name = "whatbuild-edge"
main = "worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"
# The Worker decides every request: the app's index.html must come from the service, never here.
run_worker_first = true
